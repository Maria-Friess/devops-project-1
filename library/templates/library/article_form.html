<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add article</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5">
        <header class="mb-4">
            <h1 class="display-5 fw-semibold mb-2">Add article</h1>
            <p class="text-body-secondary mb-0">Save a new item to your reading list</p>
        </header>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary" type="submit">Save article</button>
            <a class="btn btn-outline-secondary" href="{% url 'article-list' %}">Cancel</a>
        </form>
    </main>
</body>
</html>
