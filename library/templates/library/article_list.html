<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Articles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5">
        <header class="mb-4">
            <h1 class="display-5 fw-semibold mb-2">Articles</h1>
            <p class="text-body-secondary mb-0">Your saved reading list</p>
        </header>
        {% if articles %}
            <ul class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 list-unstyled">
                {% for article in articles %}
                    <li class="col">
                        <article class="card h-100 shadow-sm">
                            <div class="card-body">
                                <h2 class="card-title h5">{{ article.name }}</h2>
                                <p class="card-text text-body-secondary mb-0">{{ article.annotation }}</p>
                            </div>
                        </article>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <div class="alert alert-light border mb-0" role="status">No articles yet.</div>
        {% endif %}
    </main>
</body>
</html>
