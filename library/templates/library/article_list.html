<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Articles</title>
</head>
<body>
    <main>
        <h1>Articles</h1>
        {% if articles %}
            <ul>
                {% for article in articles %}
                    <li>
                        <h2>{{ article.name }}</h2>
                        <p>{{ article.annotation }}</p>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No articles yet.</p>
        {% endif %}
    </main>
</body>
</html>
